theme = "nord-aurora"

[editor]
line-number = "relative"
mouse = true
bufferline = "always"
color-modes = true
cursorline = true
auto-format = false
# `focus-lost` saves when Helix loses focus. `after-delay` adds a 1s idle
# auto-save so an unattended buffer doesn't sit dirty for long - the
# auto-reload handler below skips buffers with unsaved edits, so a buffer
# left modified will never get reload-prompted for external changes.
auto-save = { focus-lost = true, after-delay = { enable = true, timeout = 1000 } }

completion-trigger-len = 1
true-color = true
# Pin to pbcopy/pbpaste on macOS. Redundant with auto-detect today, but
# defensive: if anything in the launch chain ever sets TMUX again, helix's
# auto-detect would prefer `tmux save-buffer` over pasteboard.
clipboard-provider = "pasteboard"
# Implicitly trust every workspace - skips the "trust this project?" prompt
# on first open. The flag is named `insecure` because it disables the guard
# against malicious local-config / language-server payloads in untrusted
# repos. Safe enough when you only open projects you authored.
insecure = true

# Auto-reload externally-modified files. Patched in via helix-editor/helix
# PR #13963 with a local tweak that silences the periodic reload (see
# README for build provenance).
# - focus-gained: on terminal refocus, silently reload any open buffer
#   whose mtime advanced.
# - periodic.enable + interval: same check on a timer.
# Unsaved buffers are filtered out before reload, so in-flight edits
# can never be clobbered - they just stay invisible to the check until
# you save (which is why the auto-save block above matters).
#
# NOTE: this MUST come after every plain `[editor]` key (above) - once a
# `[editor.<sub>]` table header opens, all subsequent unprefixed keys
# belong to the sub-table, not to `[editor]`. Moving `insecure` etc.
# below this line silently mis-scopes them and helix ignores the values.
[editor.auto-reload]
focus-gained = true
periodic.enable = true
periodic.interval = 3000

[editor.gutters]
# Default layout omits a trailing spacer, so the diff stripe sits flush
# against the buffer content. Add one to give it breathing room.
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff", "spacer"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = false

[editor.soft-wrap]
enable = false

[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"

[keys.normal]
# Quick save/quit
"space"."w" = ":w"
"space"."q" = ":q"
"space"."x" = ":x"
# Center cursor on screen movements
"C-d" = ["half_page_down", "align_view_center"]
"C-u" = ["half_page_up", "align_view_center"]
# Easier line navigation
"H" = "goto_line_start"
"L" = "goto_line_end"

# Toggle the treelix sidebar by fullscreening the editor pane. zellij
# hides the sidebar (and any other non-focused panes) while the editor
# is fullscreen; un-toggle restores the original layout including the
# sidebar's width. treelix keeps its cursor/expansion state between
# toggles because the underlying pane stays alive - it's just hidden.
#
# Trade-off: a brief flicker on un-toggle as helix receives SIGWINCH
# and reflows from 100% to 82% width. Inherent to terminal apps.
# Close/respawn would avoid that flicker but `zellij action new-pane`
# has no --size for tiled panes (only floating), so the new sidebar
# would land at 50%, ignoring the layout's width.
"space"."e" = ":sh zellij action toggle-fullscreen"

# Reveal current buffer in the treelix sidebar pane. treelix listens on a
# per-session unix socket (see zellij/layouts/default.kdl); the dispatcher
# runs `treelix reveal <path>` against that socket so treelix expands to and
# selects the current file without stealing focus from helix. The reveal also
# tells treelix which file is "current", so it highlights the open file in the
# tree (treelix's NvimTreeOpenedFile equivalent) and feeds its `B` no-buffer
# filter.
"A-r" = ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}'"

# Jump to the current buffer in the treelix sidebar: reveal it AND move zellij
# focus into the sidebar (the --focus flag). This intentionally overwrites
# helix's default `space f` file_picker - file navigation lives in treelix in
# this setup, so leader+f means "find the current file in the tree". Unlike the
# silent auto-follow reveals below, errors stay visible (like A-r) so a sidebar
# that isn't running is obvious.
"space"."f" = ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh --focus '%{buffer_name}'"

# Auto-follow: keep the treelix sidebar pointed at the buffer helix is
# actually showing, so switching focus to the sidebar (via zellij's pane
# keys) always lands on the current file. Stock helix has no on-buffer-change
# event, so we append a silent reveal to every keybind that *immediately*
# changes the focused buffer at keypress time: buffer cycling, the goto/LSP
# jumps, last-file jumps, and the jumplist. Each preserves helix's default
# behavior and tacks on the reveal (errors suppressed when the sidebar is
# down). The reveal also marks the file "current" for highlighting and the
# `B` no-buffer filter.
#
# Irreducible gap: the buffer/symbol PICKERS (space-b, space-s, space-j, ...)
# switch the buffer only on <Enter> *inside* the picker overlay, which no config
# keybind can hook. (space-f is no longer one of these - it's rebound above to
# jump straight to the sidebar.) `A-r` stays as the manual catch-all for those.
"g"."n" = ["goto_next_buffer", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."p" = ["goto_previous_buffer", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."d" = ["goto_definition", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."D" = ["goto_declaration", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."y" = ["goto_type_definition", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."i" = ["goto_implementation", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."r" = ["goto_reference", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."f" = ["goto_file", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."a" = ["goto_last_accessed_file", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"g"."m" = ["goto_last_modified_file", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"C-o" = ["jump_backward", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]
"C-i" = ["jump_forward", ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}' 2>/dev/null"]

[keys.insert]
"j"."k" = "normal_mode"
