theme = "oh-lucy-evening"

[editor]
line-number = "relative"
mouse = true
bufferline = "always"
color-modes = true
cursorline = true
auto-format = false
# `focus-lost` saves when Helix loses focus. `after-delay` adds a 1s idle
# auto-save so an unattended buffer doesn't sit dirty for long - the
# auto-reload handler below skips buffers with unsaved edits, so a buffer
# left modified will never get reload-prompted for external changes.
auto-save = { focus-lost = true, after-delay = { enable = true, timeout = 1000 } }

completion-trigger-len = 1
true-color = true
# Pin to pbcopy/pbpaste on macOS. Redundant with auto-detect today, but
# defensive: if anything in the launch chain ever sets TMUX again, helix's
# auto-detect would prefer `tmux save-buffer` over pasteboard.
clipboard-provider = "pasteboard"
# Auto-reload externally-modified files AND refresh the git diff gutter
# on git state changes. Patched in via helix-editor/helix PR #14544
# (filesentry file watcher) plus a local commit that extends the VCS
# triggers to refs/**, packed-refs and reftable - without it the gutter
# only refreshes on branch switch, not on commit/amend/reset (those move
# the branch ref, never .git/HEAD). See README for build provenance.
# - enable: watcher-driven reload of clean buffers (silent, statusline
#   message). Unsaved buffers are never clobbered.
# - prompt-if-modified = false: a dirty buffer whose file changed on disk
#   gets a statusline warning instead of a modal prompt.
# - poll: mtime backstop for files outside the watched workspace
#   (checked on focus-gained too); watched files react instantly.
# - Language servers follow along (local patch): a reload is reported to the
#   file's servers as a save, and a changed file no buffer holds is sent to
#   rust-analyzer as `rust-analyzer/runFlycheck`, so cargo check re-runs and
#   the gutter, the diagnostics picker and the sidebar drop errors fixed by
#   another program. rust-analyzer re-checks on save only, never on
#   watched-file changes inside its workspace, so without this a fix from
#   outside hx stayed red until the next :w of anything.
#
# NOTE: this MUST come after every plain `[editor]` key (above) - once a
# `[editor.<sub>]` table header opens, all subsequent unprefixed keys
# belong to the sub-table, not to `[editor]`. Moving `insecure` etc.
# below this line silently mis-scopes them and helix ignores the values.
[editor.auto-reload]
enable = true
prompt-if-modified = false
poll.enable = true
poll.interval = 30000

# Inline git blame (GitLens-style). Virtual text after the cursor line
# showing who last touched it and when. Patched in from helix-editor/helix
# PR #13133 via the NSPC911-forks/helix `gix-blame` rebase - not in stock
# helix yet (issue #3035). See README "Local Helix patches".
# - show: never | cursor-line | all-lines. Hide at runtime with
#   `:set inline-blame.show never`, or flip with
#   `:toggle inline-blame.show cursor-line never`.
# - auto-fetch: compute blame in the background on open/change, so the
#   virtual text is there immediately instead of appearing only after a
#   manual `space B`. Cheap: gix blame runs off the render thread.
# - format: {author} {time-ago} {date} {title} {body} {commit} {email}.
# `space B` (stock binding from the patch, unbound in upstream helix) prints
# the cursor line's blame in the statusline regardless of `show`.
[editor.inline-blame]
show = "cursor-line"
auto-fetch = true
format = "{author}, {time-ago} • {title} • {commit}"

# Implicitly trust every workspace - skips the "trust this project?" prompt
# on first open. Upstream renamed the old `[editor] insecure = true` flag to
# this table when workspace-trust landed on master. `level = "insecure"`
# disables the guard against malicious local-config / language-server
# payloads in untrusted repos. Safe enough when you only open projects you
# authored.
[editor.workspace-trust]
level = "insecure"
prompt = false

[editor.gutters]
# Default layout omits a trailing spacer, so the diff stripe sits flush
# against the buffer content. Add one to give it breathing room.
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff", "spacer"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = false

[editor.soft-wrap]
enable = false

[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"

[keys.normal]
# Quick save/quit
"space"."w" = ":w"
"space"."q" = ":q"
"space"."x" = ":x"
# Center cursor on screen movements
"C-d" = ["half_page_down", "align_view_center"]
"C-u" = ["half_page_up", "align_view_center"]
# Easier line navigation
"H" = "goto_line_start"
"L" = "goto_line_end"

# Toggle the treelix sidebar by fullscreening the editor pane. zellij
# hides the sidebar (and any other non-focused panes) while the editor
# is fullscreen; un-toggle restores the original layout including the
# sidebar's width. treelix keeps its cursor/expansion state between
# toggles because the underlying pane stays alive - it's just hidden.
#
# Trade-off: a brief flicker on un-toggle as helix receives SIGWINCH
# and reflows from 100% back to its normal (~87%) width. Inherent to terminal apps.
# Close/respawn would avoid that flicker but `zellij action new-pane`
# has no --size for tiled panes (only floating), so the new sidebar
# would land at 50%, ignoring the layout's width.
"space"."e" = ":sh zellij action toggle-fullscreen"

# Sidebar follow is NOT configured here: the patched hx pushes
# `reveal-follow` to the treelix socket on every focused-buffer change
# (TREELIX_SOCKET_PATH from launch-editor.sh / the hx() zshrc wrapper).
# See README "Editor → sidebar (automatic follow)". The two bindings below
# are the manual fallbacks.

# Manual reveal, kept as a fallback: re-sends the current buffer to the
# sidebar via the dispatcher script (errors visible, so a sidebar that isn't
# running is obvious). Useful if the sidebar pane was restarted and missed
# the last follow push, or when running a stock hx without the follow patch.
"A-r" = ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh '%{buffer_name}'"

# Jump to the current buffer in the treelix sidebar: reveal it AND move zellij
# focus into the sidebar (the --focus flag). Bound to leader+t ("tree") -
# `space t` is unbound in helix's default Space menu (checked against the
# local build's keymap/default.rs). leader+f stays helix's stock file_picker.
"space"."t" = ":sh $HOME/projects/helix-files/scripts/dispatch-to-sidebar.sh --focus '%{buffer_name}'"

[keys.insert]
"j"."k" = "normal_mode"
