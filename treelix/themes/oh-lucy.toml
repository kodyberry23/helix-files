# GENERATED by scripts/apply-theme.sh from themes/oh-lucy.toml -
# edit themes/<name>.toml or themes/templates/treelix.toml.tmpl, NOT this file.
#
# Format:
#   [palette]   name = "#RRGGBB"
#   [styles]    element = "fg" | "fg / bg" | "fg / bg / mod,mod"
#               where fg/bg is a palette name, a #hex value, or "none".
#               modifiers: bold, italic, underline, dim, reversed.

[palette]
bg           = "#1B1D26"
bgSurface    = "#272932"
bgHighlight  = "#272932"
bgHighlight2 = "#555B6C"
fg           = "#D7D7D7"
fgBright     = "#E9E9E9"
fgMuted      = "#555B6C"
accent       = "#FB7DA7"
accentAlt    = "#74C7A4"
folder       = "#8DBBD3"
red    = "#D95555"
orange = "#E39A65"
yellow = "#E9D26C"
green  = "#76C5A4"
purple = "#AF98E6"

[styles]
text          = "fg"
# "none" keeps the terminal-default background so ghostty transparency
# shows through the sidebar (mirrors helix `ui.background = {}`).
background    = "none"
selection     = "none / bgHighlight2"
directory     = "folder / none / bold"
root          = "fgBright / none / bold"
indent_marker = "fgMuted"
arrow         = "fgMuted"
icon          = "fg"
folder_icon   = "folder"
symlink       = "accentAlt"
executable    = "green"
git_staged    = "green"
git_dirty     = "yellow"
git_deleted   = "red"
git_renamed   = "yellow"
git_conflict  = "red"
git_untracked = "orange"
git_ignored   = "fgMuted"
cut           = "red / none / italic"
copy          = "yellow"
# Bold only, normal text color (nvim-tree's SpecialFile convention): a
# status COLOR here is a trap — yellow collided with git_dirty, making
# curated "special" files (package.json, README.md, ...) read as modified.
special       = "fg / none / bold"
opened        = "fgBright / none / bold"
bookmark      = "purple"
selected      = "none / bgHighlight"
help          = "fg"
help_title    = "accent / none / bold"
prompt        = "orange / none / bold"
filter_prefix = "purple / none / bold"
