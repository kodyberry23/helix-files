# Global mise config. Symlink to ~/.config/mise/config.toml.
# Helix discovers these via PATH once `mise activate zsh` is sourced from .zshrc.

[settings]
# Keep mise's tool bin dirs at the FRONT of PATH even after later PATH
# mutations (e.g. Homebrew's `eval "$(brew shellenv)"`). Without this,
# /opt/homebrew/bin/erl shadows mise's erlang, and `mise install elixir`
# crashes during its post-install `elixir --version` check because the
# OTP-28 Elixir build links against the wrong erl.
activate_aggressive = true

[tools]
# ─── Language runtimes ────────────────────────────────────────────────────
# postinstall: yarn comes from Corepack (see the note in the npm section);
# re-enable its shim and default it to current stable (Yarn 4/berry)
# whenever a new node version lands. The `|| true` keeps a registry hiccup
# from failing the whole node install - update.sh re-runs both steps
# idempotently on every update anyway.
node     = { version = "lts", postinstall = "corepack enable yarn && corepack install -g yarn@stable || true" }
rust     = "stable"
java     = "21"
elixir   = "1.19.5-otp-28"
erlang   = "28"

# ─── Language servers (mise-installable) ──────────────────────────────────
rust-analyzer                    = "latest"  # aqua: rust-lang/rust-analyzer
elixir-ls                        = "latest"  # asdf: mise-plugins/mise-elixir-ls
"npm:typescript"                 = "latest"
"npm:typescript-language-server" = "latest"

# ─── npm CLI tools ────────────────────────────────────────────────────────
# TypeScript runner (run .ts directly, `tsx watch` for dev loops)
"npm:tsx" = "latest"
# Playwright CLI (installs the `playwright-cli` binary). Replaces the stray
# Homebrew-npm global copy whose leftover daemon once swallowed every
# "open in default browser" (see memory: playwright-chrome-steals-url-opens).
#
# trust_policy_excludes: mise's embedded npm installer (aube, the default
# since mise 2026.7.12) refuses a release whose publish evidence is weaker than
# any earlier release of the same package. @playwright/cli 0.1.0-0.1.18 and
# playwright/playwright-core through 1.62.x were published by GitHub
# Actions with SLSA provenance; from 0.1.19 / the 1.63 alphas on, Microsoft
# publishes through its internal ESRP pipeline (microsoft/playwright-cli
# commit cbc09311, 2026-08-27, "publish all npm versions via ESRP
# pipeline"), which emits no provenance. Reviewed 2026-09-03: the npm
# publisher (microsoft1es) is a listed package maintainer and the 0.1.19
# tarball is byte-identical to the v0.1.19 tag. The switch is permanent, so
# the exception is open-ended: a range for the cli (plain semver), bare
# names for the two transitive packages because their date-stamped
# prerelease versions (1.6x.0-alpha-YYYY-MM-DD) do not match semver ranges
# across minor bumps.
"npm:@playwright/cli" = { version = "latest", trust_policy_excludes = [
  "@playwright/cli@>=0.1.19",
  "playwright",
  "playwright-core",
] }
# Check package.json dependency ranges for updates (`ncu`; `ncu -i` to pick)
"npm:npm-check-updates" = "latest"
# Yarn is deliberately NOT installed here. A global npm yarn (1.22.x) hard-
# errors in any repo pinned via package.json `packageManager: "yarn@..."`
# (Yarn 2+): that pin is Corepack's mechanism. Instead Corepack provides the
# `yarn` shim (node's postinstall above; update.sh re-runs it idempotently
# for machines whose node predates this), so each repo gets the exact
# version it pins; unpinned directories get Corepack's global default,
# which is set to yarn@stable (4.x/berry, not classic). Not
# `settings.node.corepack = true`: that would also install Corepack's pnpm
# shim, fighting the explicit pnpm pin below.
# Static file server for quick local checks (`serve dist/`)
"npm:serve" = "latest"

# ─── Formatters used by helix/languages.toml ──────────────────────────────
"npm:prettier" = "latest"
"pipx:ruff"    = "latest"
"cargo:taplo-cli" = "latest"
pnpm = "10.10.0"

# Note: jdtls and erlang_ls are not in the mise registry on macOS.
# Install via Homebrew: brew install jdtls erlang_ls
