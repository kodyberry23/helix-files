# Global mise config. Symlink to ~/.config/mise/config.toml.
# Helix discovers these via PATH once `mise activate zsh` is sourced from .zshrc.

[settings]
# Keep mise's tool bin dirs at the FRONT of PATH even after later PATH
# mutations (e.g. Homebrew's `eval "$(brew shellenv)"`). Without this,
# /opt/homebrew/bin/erl shadows mise's erlang, and `mise install elixir`
# crashes during its post-install `elixir --version` check because the
# OTP-28 Elixir build links against the wrong erl.
activate_aggressive = true

[tools]
# ─── Language runtimes ────────────────────────────────────────────────────
node     = "lts"
rust     = "stable"
java     = "21"
elixir   = "1.19.5-otp-28"
erlang   = "28"

# ─── Language servers (mise-installable) ──────────────────────────────────
rust-analyzer                    = "latest"  # aqua: rust-lang/rust-analyzer
elixir-ls                        = "latest"  # asdf: mise-plugins/mise-elixir-ls
"npm:typescript"                 = "latest"
"npm:typescript-language-server" = "latest"

# ─── npm CLI tools ────────────────────────────────────────────────────────
# TypeScript runner (run .ts directly, `tsx watch` for dev loops)
"npm:tsx" = "latest"
# Playwright CLI (installs the `playwright-cli` binary). Replaces the stray
# Homebrew-npm global copy whose leftover daemon once swallowed every
# "open in default browser" (see memory: playwright-chrome-steals-url-opens).
"npm:@playwright/cli" = "latest"
# Check package.json dependency ranges for updates (`ncu`; `ncu -i` to pick)
"npm:npm-check-updates" = "latest"
# Static file server for quick local checks (`serve dist/`)
"npm:serve" = "latest"

# ─── Formatters used by helix/languages.toml ──────────────────────────────
"npm:prettier" = "latest"
"pipx:ruff"    = "latest"
"cargo:taplo-cli" = "latest"
pnpm = "10.10.0"

# Note: jdtls and erlang_ls are not in the mise registry on macOS.
# Install via Homebrew: brew install jdtls erlang_ls
